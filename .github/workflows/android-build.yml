name: Build Android release candidates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci && npm test && npm run sync
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug bundleRelease
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: fluffy-forest-android-1.2.0-unsigned
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
