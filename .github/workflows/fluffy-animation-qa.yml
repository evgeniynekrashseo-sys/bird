name: Fluffy Forest game and animation QA

on:
  pull_request:
    paths:
      - 'game.js'
      - 'style.css'
      - 'mobile/www/**'
      - 'mobile/tests/**'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/fluffy-animation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install game dependencies
        run: npm ci --no-audit --no-fund
        working-directory: mobile
      - name: Test levels, locales, audio and animation guards
        run: npm test
        working-directory: mobile
