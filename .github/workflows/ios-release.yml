name: Fluffy Forest iOS App Store archive (signed)

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload the signed IPA to App Store Connect after a successful build'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: fluffy-ios-release
  cancel-in-progress: false

jobs:
  signed-ipa:
    name: Build signed App Store IPA
    runs-on: macos-26
    environment: ios-release
    timeout-minutes: 60

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install and test
        working-directory: mobile
        run: |
          npm ci
          npm test

      - name: Ensure CocoaPods is available on macOS runner
        run: |
          if ! command -v pod >/dev/null 2>&1; then brew install cocoapods; fi
          pod --version

      - name: Synchronize native iOS app and local CocoaPods
        working-directory: mobile
        run: |
          npm run build:voice
          npm run build:audio
          npm run build:ads --if-present
          npx cap sync ios
          test -s ios/App/Podfile.lock
          test -s ios/App/App.xcworkspace/contents.xcworkspacedata

      - name: Check signing inputs and Xcode version
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${IOS_DISTRIBUTION_P12_BASE64:?Missing IOS_DISTRIBUTION_P12_BASE64}"
          : "${IOS_DISTRIBUTION_P12_PASSWORD:?Missing IOS_DISTRIBUTION_P12_PASSWORD}"
          : "${IOS_PROVISIONING_PROFILE_BASE64:?Missing IOS_PROVISIONING_PROFILE_BASE64}"
          xcodebuild -version
          xcodebuild -version | awk 'NR==1 { split($2,v,"."); if (v[1] < 26) exit 1 }'

      - name: Import Apple Distribution identity and app profile
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 -D > "$RUNNER_TEMP/fluffy-dist.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/fluffy-profile.mobileprovision"

          keychain="$RUNNER_TEMP/fluffy-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" /Library/Keychains/System.keychain
          security default-keychain -s "$keychain"
          security import "$RUNNER_TEMP/fluffy-dist.p12" -f pkcs12 -t cert -k "$keychain" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"

          security cms -D -i "$RUNNER_TEMP/fluffy-profile.mobileprovision" > "$RUNNER_TEMP/fluffy-profile.plist"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/fluffy-profile.plist")"
          if [ "$app_id" != 'QX87B6Q3N7.agency.blackorange.fluffyforest' ]; then
            echo 'The provisioning profile does not match Fluffy Forest.' >&2
            exit 1
          fi
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/fluffy-profile.plist")"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          cp "$RUNNER_TEMP/fluffy-profile.mobileprovision" "$profile_dir/$uuid.mobileprovision"
          echo "FLUFFY_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

      - name: Archive signed iOS Release app
        working-directory: mobile/ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FluffyForest.xcarchive" \
            archive

      - name: Export signed IPA for App Store Connect
        run: |
          set -euo pipefail
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            '<key>destination</key><string>export</string>' \
            '<key>signingStyle</key><string>manual</string>' \
            '<key>teamID</key><string>QX87B6Q3N7</string>' \
            '<key>provisioningProfiles</key><dict>' \
            '<key>agency.blackorange.fluffyforest</key><string>FluffyForest_AppStore</string>' \
            '</dict></dict></plist>' > "$RUNNER_TEMP/FluffyForestExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/FluffyForestExportOptions.plist"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/FluffyForest.xcarchive" \
            -exportPath "$RUNNER_TEMP/fluffy-ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/FluffyForestExportOptions.plist"
          test -n "$(find "$RUNNER_TEMP/fluffy-ipa" -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Upload signed IPA for manual review
        uses: actions/upload-artifact@v4
        with:
          name: fluffy-forest-app-store-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/fluffy-ipa/*.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Upload signed IPA to App Store Connect for TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          : "${ASC_API_KEY_P8_BASE64:?Missing ASC_API_KEY_P8_BASE64}"
          : "${ASC_API_KEY_ID:?Missing ASC_API_KEY_ID}"
          : "${ASC_API_ISSUER_ID:?Missing ASC_API_ISSUER_ID}"

          auth_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$auth_dir"
          chmod 700 "$auth_dir"
          key_file="$auth_dir/AuthKey_${ASC_API_KEY_ID}.p8"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$key_file"
          chmod 600 "$key_file"

          ipa="$(find "$RUNNER_TEMP/fluffy-ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -s "$ipa"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Remove temporary signing material
        if: always()
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/fluffy-build.keychain-db"
          if [ -n "${FLUFFY_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$FLUFFY_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/fluffy-dist.p12" "$RUNNER_TEMP/fluffy-profile.mobileprovision" "$RUNNER_TEMP/fluffy-profile.plist"
