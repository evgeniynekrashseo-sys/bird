<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Fluffy Forest</title><style>*{box-sizing:border-box}body{margin:0;background:#17192c;color:white;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:20px;pointer-events:none}header button{pointer-events:auto}button{border:1px solid #ffffff55;border-radius:22px;background:#ffffff25;color:white;padding:12px 17px;font-size:17px;backdrop-filter:blur(12px)}#msg{position:absolute;bottom:25px;left:10%;width:80%;text-align:center;text-shadow:0 2px 8px #000}#win{display:none;position:absolute;inset:0;background:#0d1229cc;align-items:center;justify-content:center;flex-direction:column;gap:18px;backdrop-filter:blur(8px)}#win h1{font-size:38px}</style><canvas id="c"></canvas><header><button id="reset">↺</button><div id="level">Рівень 1</div><button id="undo">↶</button></header><div id="msg">Торкнись тваринки, потім іншої гілки</div><div id="win"><h1>✨ Чудово!</h1><div>Усі звірята знайшли друзів</div><button id="next">Наступний рівень →</button></div><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d');let W,H,dpr,level=+(localStorage.fluffyLevel||1),stacks=[],selected=-1,history=[],particles=[];const types=['🦊','🐼','🐰','🦝','🐨','🦔'];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function start(){let n=Math.min(3+Math.floor((level-1)/3),5),capacity=3,items=[];for(let t=0;t<n;t++)for(let j=0;j<capacity;j++)items.push(t);for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}stacks=[];for(let i=0;i<n;i++)stacks.push(items.splice(0,capacity));stacks.push([],[]);selected=-1;history=[];document.querySelector('#level').textContent='Рівень '+level;document.querySelector('#win').style.display='none'}start();const lerp=(a,b,t)=>a+(b-a)*t;function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function background(t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#222b51');g.addColorStop(.55,'#76546d');g.addColorStop(1,'#b5816b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let layer=0;layer<3;layer++){ctx.fillStyle=['#182b3c','#172a35','#10232c'][layer];for(let k=0;k<15;k++){let x=(k*137+layer*79)%(W+140)-70,y=H*(.38+layer*.19)+Math.sin(k*2+layer)*45;ctx.beginPath();ctx.ellipse(x,y,55+layer*20,75+layer*20,0,0,7);ctx.fill();ctx.fillRect(x-9,y,18,H-y)}}for(let i=0;i<90;i++){let x=(i*91.7)%W,y=(i*127.3+t*(5+i%4))%H;ellipse(x,y,1+i%3*.35,1+i%3*.35,'#ffffff88')}}function animal(x,y,r,type,t,active){let palette=['#e98642','#e9e5d7','#c8a1e4','#9ca7b2','#8aa9a0','#cfa477'];let col=palette[type];let bob=Math.sin(t*2+x*.1)*1.7;ctx.save();ctx.translate(x,y+bob-(active?13:0));ctx.shadowColor='#05071499';ctx.shadowBlur=14;ellipse(0,3,r*.9,r*.81,col);ctx.shadowBlur=0;ellipse(-r*.55,-r*.6,r*.31,r*.43,col);ellipse(r*.55,-r*.6,r*.31,r*.43,col);ellipse(-r*.55,-r*.6,r*.16,r*.23,'#e8a9af');ellipse(r*.55,-r*.6,r*.16,r*.23,'#e8a9af');ellipse(-r*.35,-r*.05,r*.26,r*.34,'#fff');ellipse(r*.35,-r*.05,r*.26,r*.34,'#fff');ellipse(-r*.31,-r*.03,r*.17,r*.24,'#242333');ellipse(r*.31,-r*.03,r*.17,r*.24,'#242333');ellipse(-r*.36,-r*.12,r*.065,r*.09,'#fff');ellipse(r*.26,-r*.12,r*.065,r*.09,'#fff');ellipse(0,r*.34,r*.12,r*.09,'#543c43');ellipse(-r*.42,r*.78,r*.17,r*.12,col);ellipse(r*.42,r*.78,r*.17,r*.12,col);ctx.restore()}function layout(){let cols=2,rows=Math.ceil(stacks.length/cols),gapY=Math.min(125,(H-180)/rows),r=Math.min(24,(W-55)/8);return {rows,gapY,r,top:(H-rows*gapY)/2+gapY*.5}}function pos(i){let a=layout();return {x:(i%2===0?W*.25:W*.75),y:a.top+Math.floor(i/2)*a.gapY}}function draw(t){t/=1000;background(t);let a=layout();for(let i=0;i<stacks.length;i++){let p=pos(i),length=Math.min(W*.43,180);ctx.save();ctx.shadowColor='#090b1b99';ctx.shadowBlur=13;ctx.fillStyle='#71442f';ctx.beginPath();ctx.moveTo(p.x-length/2,p.y+18);ctx.lineTo(p.x+length/2,p.y+18);ctx.lineTo(p.x+length/2-15,p.y+29);ctx.lineTo(p.x-length/2+12,p.y+29);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#d29a62';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x-length/2,p.y+18);ctx.quadraticCurveTo(p.x,p.y+14,p.x+length/2,p.y+18);ctx.stroke();ctx.restore();let arr=stacks[i];for(let j=0;j<arr.length;j++){let dx=(j-(arr.length-1)/2)*a.r*1.75;animal(p.x+dx,p.y-a.r*.15,a.r,arr[j],t,selected===i&&j===arr.length-1)}if(selected===i){ctx.strokeStyle='#f9df8e';ctx.lineWidth=2;ctx.strokeRect(p.x-length/2,p.y-48,length,79)}}requestAnimationFrame(draw)}requestAnimationFrame(draw);function tap(x,y){if(document.querySelector('#win').style.display==='flex')return;let a=layout(),index=-1,dist=Infinity;for(let i=0;i<stacks.length;i++){let p=pos(i),d=Math.hypot((x-p.x)*.8,y-p.y);if(d<dist){dist=d;index=i}}if(dist>a.gapY*.55)return;if(selected<0){if(stacks[index].length)selected=index;return}if(selected===index){selected=-1;return}let src=stacks[selected],dst=stacks[index];if(src.length&&dst.length<3&&(!dst.length||dst[dst.length-1]===src[src.length-1])){history.push(JSON.stringify(stacks));dst.push(src.pop());if(stacks.every(s=>!s.length||s.length===3&&s.every(v=>v===s[0]))){setTimeout(()=>document.querySelector('#win').style.display='flex',450)}}else{document.querySelector('#msg').textContent='Потрібна вільна гілка або такий самий звір';setTimeout(()=>document.querySelector('#msg').textContent='Збери однакових звірят на одній гілці',1800)}selected=-1}c.addEventListener('pointerup',e=>tap(e.clientX,e.clientY));document.querySelector('#reset').onclick=start;document.querySelector('#undo').onclick=()=>{if(history.length){stacks=JSON.parse(history.pop());selected=-1}};document.querySelector('#next').onclick=()=>{level++;localStorage.fluffyLevel=level;start()};
</script></html>
